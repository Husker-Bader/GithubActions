name: ECEN 304 narrated whiteboard review
on:
  push:
    branches: [ecen304-narrated-review-2026]
    paths:
      - 'ecen304_video/**'
      - '.github/workflows/ecen304-video.yml'
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Install open-source rendering dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow matplotlib numpy
      - name: Assemble voiceover with animated lesson frames
        run: python ecen304_video/render.py
      - name: Upload playable MP4
        uses: actions/upload-artifact@v4
        with:
          name: ECEN304-Narrated-Whiteboard-MP4
          path: ecen304_video/ECEN304_Narrated_Whiteboard_Review.mp4
          if-no-files-found: error
          retention-days: 14
